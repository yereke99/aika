<!-- static/welcome.html (FULL / FORCE FULLSCREEN + BETTER DESIGN + SAME LOGIC) -->
<!DOCTYPE html>
<html lang="kz">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual"
  />
  <title>AIKA - Қош келдіңіз</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui,sans-serif;
      color:#fff;
      height: var(--tg-viewport-stable-height, 100vh);
      min-height: 100vh;
      padding-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px) + 18px);
      padding-bottom: calc(var(--tg-safe-area-inset-bottom, 0px) + 22px);
      padding-left: 18px;
      padding-right: 18px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        radial-gradient(900px 600px at 15% 10%, rgba(255,0,110,.25), transparent 60%),
        radial-gradient(900px 600px at 85% 30%, rgba(130,87,255,.20), transparent 60%),
        radial-gradient(700px 500px at 50% 95%, rgba(0,229,255,.10), transparent 65%),
        linear-gradient(135deg,#05000c 0%, #14001f 35%, #080014 100%);
      overflow:hidden;
    }

    /* subtle animated noise-ish glow */
    .bg-orb{
      position:fixed; inset:auto;
      width:520px; height:520px;
      border-radius:50%;
      filter: blur(60px);
      opacity:.22;
      pointer-events:none;
      animation: float 7s ease-in-out infinite;
    }
    .bg-orb.one{left:-180px; top:-140px; background: radial-gradient(circle at 30% 30%, #ff006e, transparent 55%);}
    .bg-orb.two{right:-220px; top:40px; background: radial-gradient(circle at 30% 30%, #7c3aed, transparent 55%); animation-delay: -2s;}
    .bg-orb.three{left:20%; bottom:-240px; background: radial-gradient(circle at 30% 30%, #00e5ff, transparent 55%); animation-delay: -4s;}
    @keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,16px,0)}}

    .container{
      width:100%;
      max-width: 540px;
      text-align:center;
      position:relative;
      z-index:1;
    }

    .card{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      padding: 26px 22px;
      box-shadow:
        0 20px 70px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .top{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .logo{
      width: 78px;
      height: 78px;
      display:grid;
      place-items:center;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,0,110,.22), rgba(124,58,237,.18));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      animation: pulse 2.6s ease-in-out infinite;
      user-select:none;
    }
    .logo span{font-size: 40px; transform: translateY(1px);}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

    .brand{
      font-size: 44px;
      font-weight: 1000;
      letter-spacing: 10px;
      line-height: 1;
      background: linear-gradient(45deg,#ff006e,#ff4d94,#ff80b3,#b983ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      text-shadow: 0 10px 30px rgba(255,0,110,.08);
    }

    .tagline{
      font-size: 15px;
      color: rgba(255,255,255,.70);
      margin-top: 2px;
    }

    .welcome-text{
      margin-top: 14px;
      font-size: 19px;
      line-height: 1.55;
      color: rgba(255,255,255,.92);
    }

    .divider{
      margin: 18px auto 16px;
      width: 86%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    }

    .btn-container{
      display:flex;
      flex-direction:column;
      gap: 12px;
      margin-top: 10px;
    }

    .btn{
      -webkit-tap-highlight-color: transparent;
      padding: 16px 18px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .2s ease, opacity .2s ease, background .2s ease;
      text-decoration: none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      position: relative;
      overflow:hidden;
      user-select:none;
    }

    .btn::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(400px 120px at 30% 0%, rgba(255,255,255,.20), transparent 55%);
      opacity:.55;
      pointer-events:none;
    }

    .btn:active{transform:scale(.985); opacity:.95}

    .btn-primary{
      background: linear-gradient(45deg,#ff006e,#ff4d94);
      color:#fff;
      box-shadow: 0 18px 40px rgba(255,0,110,.20);
    }
    .btn-primary:hover{box-shadow: 0 22px 55px rgba(255,0,110,.26)}

    .btn-secondary{
      background: rgba(255,255,255,.08);
      color:#fff;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 14px 30px rgba(0,0,0,.22);
    }

    .features{
      margin-top: 18px;
      display:grid;
      gap: 10px;
      text-align:left;
    }

    .feature{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .feature-icon{
      width: 40px;
      height: 40px;
      display:grid;
      place-items:center;
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      font-size: 20px;
      flex: 0 0 40px;
    }
    .feature-text{
      font-size: 14.5px;
      color: rgba(255,255,255,.80);
      line-height: 1.3;
    }

    .hint{
      margin-top: 14px;
      font-size: 12.5px;
      color: rgba(255,255,255,.55);
    }

    /* small screens */
    @media (max-width: 360px){
      .brand{font-size: 38px; letter-spacing: 8px}
      .welcome-text{font-size: 18px}
    }
  </style>
</head>

<body>
  <div class="bg-orb one"></div>
  <div class="bg-orb two"></div>
  <div class="bg-orb three"></div>

  <div class="container">
    <div class="card">
      <div class="top">
        <div class="logo" aria-hidden="true"><span>💕</span></div>
        <div class="brand">AIKA</div>
        <div class="tagline">Жаңа танысулар әлемі</div>
      </div>

      <div class="welcome-text">Қош келдіңіз! AIKA-мен жаңа адамдармен танысыңыз</div>

      <div class="divider"></div>

      <div class="btn-container">
        <a href="/register.html" class="btn btn-primary" id="startBtn">🚀 Бастау</a>
        <a href="/list.html" class="btn btn-secondary" id="browseBtn">👥 Адамдарды қарау</a>
        <!-- Бұл батырма тек профиль бар болса көрсетіледі -->
        <a href="/user-update.html" class="btn btn-secondary" id="myProfileBtn" style="display:none;">👤 Менің профилімді қарау</a>
      </div>

      <div class="features">
        <div class="feature">
          <div class="feature-icon">📍</div>
          <div class="feature-text">Жақын маңдағы адамдарды табыңыз</div>
        </div>
        <div class="feature">
          <div class="feature-icon">💬</div>
          <div class="feature-text">Қызықты әңгімелесулер</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🔒</div>
          <div class="feature-text">Қауіпсіз және жеке</div>
        </div>
      </div>

      <div class="hint">Telegram ішінде толық экран режимі автоматты түрде қосылады</div>
    </div>
  </div>

  <script>
    // --- Telegram Fullscreen / Expand (works best when opened from menu button / direct mini-app) ---
    const tg = window.Telegram?.WebApp;

    function forceFullScreen() {
      if (!tg) return;

      try {
        // Tell Telegram we want maximum height
        tg.expand?.();

        // Newer Telegram clients may support requestFullscreen()
        // (If unsupported, it will throw or be undefined - we ignore.)
        tg.requestFullscreen?.();

        // Also try to disable vertical swipes collapsing (if supported)
        tg.disableVerticalSwipes?.();

        // Make sure area is visible and theme is applied
        tg.ready?.();

      } catch (e) {
        console.warn("TG fullscreen/expand not supported:", e);
      }

      // Sync Telegram CSS vars (some clients update them after expand)
      try {
        const apply = () => {
          const vh = tg.viewportStableHeight || window.innerHeight;
          document.documentElement.style.setProperty("--tg-viewport-stable-height", vh + "px");
        };
        apply();
        tg.onEvent?.("viewportChanged", apply);
      } catch (_) {}
    }

    // Run ASAP + after load to catch menu-button open behavior
    forceFullScreen();
    window.addEventListener("load", forceFullScreen);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") forceFullScreen();
    });

    // --- Existing logic: check user exists and swap buttons ---
    async function checkUser() {
      const user = tg?.initDataUnsafe?.user;
      if (!user?.id) return;

      try {
        const resp = await fetch("/api/user/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ telegram_id: user.id }),
        });

        // If server returns non-200, don't crash UI
        let data = {};
        try { data = await resp.json(); } catch (_) {}

        if (data.exists) {
          const startBtn = document.getElementById("startBtn");
          startBtn.textContent = "👤 Профильге өту";
          startBtn.href = "/user-update.html";
          document.getElementById("myProfileBtn").style.display = "flex";
        }
      } catch (e) {
        console.error(e);
      }
    }

    checkUser();

    // Optional: give Telegram haptic feedback on taps (nice UX)
    document.addEventListener("click", (e) => {
      const a = e.target?.closest?.("a.btn");
      if (!a || !tg?.HapticFeedback) return;
      try { tg.HapticFeedback.impactOccurred("light"); } catch (_) {}
    });
  </script>
</body>
</html>
