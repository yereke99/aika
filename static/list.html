<!-- static/list.html (AIKA — improved UI + SINGLE geo prompt + stable TG safe-areas)
FIXED: iOS/Telegram permission flow (openSettings on denied) + 1-time stored permission + retry after settings -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AIKA - Люди рядом</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      --bg:#000;
      --surface:rgba(255,255,255,.06);
      --surface2:rgba(255,255,255,.085);
      --stroke:rgba(255,255,255,.12);
      --stroke2:rgba(255,255,255,.18);
      --text:#fff;
      --muted:rgba(255,255,255,.58);
      --muted2:rgba(255,255,255,.42);
      --pink1:#ff006e;
      --pink2:#ff4d94;
      --hot:rgba(255,0,110,.32);
      --shadow:0 18px 60px rgba(0,0,0,.55);

      /* Telegram safe area vars (fallbacks) */
      --tg-viewport-stable-height:100vh;
      --tg-safe-area-inset-top: env(safe-area-inset-top, 0px);
      --tg-safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
      --tg-content-safe-area-inset-top: 0px;
      --tg-content-safe-area-inset-bottom: 0px;
      --tg-top-inset: calc(var(--tg-safe-area-inset-top) + var(--tg-content-safe-area-inset-top));
      --tg-bottom-inset: calc(var(--tg-safe-area-inset-bottom) + var(--tg-content-safe-area-inset-bottom));

      --max: 640px;
      --padX: clamp(14px, 4vw, 18px);
      --radius: 18px;
      --radiusLg: 22px;
    }

    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;width:100%;background:var(--bg);color:var(--text)}
    body{
      height:var(--tg-viewport-stable-height,100vh);
      overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
      touch-action:manipulation;
    }

    /* ===== App layout ===== */
    .app{
      position:fixed; inset:0;
      display:flex; flex-direction:column;
      background:
        radial-gradient(1200px 600px at 70% -10%, rgba(255,0,110,.18), transparent 55%),
        radial-gradient(900px 520px at -10% 20%, rgba(255,77,148,.12), transparent 60%),
        #000;
    }

    .top{
      position:sticky; top:0; z-index:100;
      padding-top: calc(var(--tg-top-inset) + 10px);
      background: linear-gradient(180deg, rgba(0,0,0,.92), rgba(0,0,0,.72) 60%, rgba(0,0,0,0));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .top-inner{
      max-width:var(--max); margin:0 auto;
      padding: 10px var(--padX) 10px;
      display:flex; align-items:center; gap:12px;
    }

    .brand-wrap{display:flex; align-items:center; gap:10px; min-width:0;}
    .logo{
      width:40px;height:40px;border-radius:14px;
      background:linear-gradient(135deg, rgba(255,0,110,.95), rgba(255,77,148,.95));
      box-shadow:0 10px 30px rgba(255,0,110,.18);
      display:flex;align-items:center;justify-content:center;
      font-weight:950; letter-spacing:1px;
    }
    .brand{
      display:flex; flex-direction:column; min-width:0;
      line-height:1.1;
    }
    .brand .title{
      font-size:18px; font-weight:950; letter-spacing:2.5px;
      background:linear-gradient(45deg,var(--pink1),var(--pink2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      white-space:nowrap;
    }
    .brand .sub{
      font-size:12px; color:var(--muted2);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    .actions{margin-left:auto; display:flex; gap:8px; align-items:center;}
    .pill{
      height:36px;
      padding:0 12px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      font-size:13px;
      font-weight:800;
      cursor:pointer;
      display:inline-flex; align-items:center; gap:8px;
      transition:transform .15s ease, background .15s ease, border-color .15s ease;
      user-select:none;
    }
    .pill:active{transform:scale(.98)}
    .pill:hover{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.26)}
    .pill.primary{
      border:none;
      background:linear-gradient(45deg,var(--pink1),var(--pink2));
      box-shadow:0 10px 24px rgba(255,0,110,.18);
    }

    .lang-row{
      max-width:var(--max); margin:0 auto;
      padding: 0 var(--padX) 10px;
      display:flex; justify-content:flex-end; gap:8px;
    }
    .lang-btn{
      height:30px; padding:0 12px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      transition:.2s;
    }
    .lang-btn.active{
      background:linear-gradient(45deg,var(--pink1),var(--pink2));
      border-color:transparent;
    }

    .content{
      flex:1;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      padding-bottom: calc(var(--tg-bottom-inset) + 16px);
      scrollbar-width:none;
    }
    .content::-webkit-scrollbar{display:none}

    .container{
      max-width:var(--max);
      margin:0 auto;
      padding: 10px var(--padX) 18px;
    }

    /* ===== Feed header (chips) ===== */
    .chips{
      display:flex; gap:10px; flex-wrap:wrap;
      margin: 4px 0 12px;
      align-items:center;
    }
    .chip{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
      color:rgba(255,255,255,.9);
      font-size:12px; font-weight:800;
      user-select:none;
    }
    .chip .dot{
      width:8px;height:8px;border-radius:999px;
      background:linear-gradient(45deg,var(--pink1),var(--pink2));
      box-shadow:0 0 0 4px rgba(255,0,110,.14);
    }
    .chip.muted{color:var(--muted);}

    /* ===== Cards ===== */
    .user-card{
      background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      padding:14px;
      margin-bottom:12px;
      display:flex;
      gap:14px;
      cursor:pointer;
      transition:transform .18s ease, border-color .18s ease, background .18s ease;
      position:relative;
      overflow:hidden;
    }
    .user-card::before{
      content:'';
      position:absolute; inset:-60% -20% auto auto;
      width:220px; height:220px;
      background:radial-gradient(circle, rgba(255,0,110,.22), transparent 60%);
      transform:rotate(18deg);
      pointer-events:none;
    }
    .user-card:hover{
      transform:translateY(-1px);
      border-color:rgba(255,0,110,.34);
      background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.05));
    }
    .avatar{
      width:62px;height:62px;border-radius:999px;flex-shrink:0;
      background:rgba(255,255,255,.10);
      border:2px solid rgba(255,0,110,.26);
      overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 10px 22px rgba(0,0,0,.35);
      position:relative;
    }
    .avatar img{width:100%;height:100%;object-fit:cover}
    .avatar .ph{font-size:26px}
    .info{flex:1; min-width:0; position:relative;}
    .name-row{
      display:flex; align-items:center; gap:10px;
      margin-bottom:6px;
      min-width:0;
    }
    .nickname{
      font-size:16px; font-weight:900;
      color:#fff;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .badge{
      font-size:11px; font-weight:900;
      padding:6px 10px; border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.15);
      color:rgba(255,255,255,.88);
      flex-shrink:0;
    }
    .meta{
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      font-size:12px; color:var(--muted);
      margin-bottom:8px;
    }
    .distance{
      font-size:12px; font-weight:950;
      color:#ff3d84;
      background:rgba(255,0,110,.12);
      border:1px solid rgba(255,0,110,.20);
      padding:6px 10px;
      border-radius:999px;
    }
    .about{
      font-size:13px;
      color:rgba(255,255,255,.78);
      line-height:1.45;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    /* ===== Loader / Empty ===== */
    .loader{
      padding:26px 0 14px;
      color:var(--muted);
      text-align:center;
    }
    .spinner{
      width:42px;height:42px;border-radius:999px;
      border:4px solid rgba(255,255,255,.10);
      border-top-color: var(--pink1);
      margin:0 auto 12px;
      animation:spin 1s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .skeleton{
      display:grid; gap:10px;
      margin-top:12px;
    }
    .sk-card{
      height:92px;
      border-radius: 22px;
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.09), rgba(255,255,255,.05));
      background-size:200% 100%;
      animation:shimmer 1.2s infinite linear;
    }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    .empty{
      text-align:center;
      padding:64px 10px;
      color:var(--muted);
    }
    .empty .icon{font-size:56px;margin-bottom:14px}
    .empty .title{font-size:16px;font-weight:900;color:rgba(255,255,255,.86);margin-bottom:6px}
    .empty .sub{font-size:13px;color:rgba(255,255,255,.45)}

    /* ===== Filter sheet ===== */
    .sheet{
      position:fixed; inset:0;
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      display:none;
      z-index:300;
      padding: 16px;
      padding-bottom: calc(var(--tg-bottom-inset) + 16px);
    }
    .sheet .card{
      position:absolute; left:50%; bottom:12px;
      transform:translateX(-50%);
      width:min(640px, calc(100vw - 24px));
      background:rgba(17,17,17,.92);
      border:1px solid rgba(255,255,255,.10);
      border-radius:22px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .sheet .head{
      padding:14px 16px 12px;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .sheet .head .ttl{font-weight:950}
    .sheet .head .x{
      width:34px;height:34px;border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:#fff; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-weight:950;
    }
    .sheet .body{padding:14px 16px 16px}
    .row{display:flex; gap:10px; margin-bottom:10px}
    .row>*{flex:1; min-width:0}
    .lbl{font-size:12px; color:rgba(255,255,255,.62); font-weight:800; margin-bottom:6px; display:block}
    .input,.select{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.35);
      color:#fff;
      font-size:14px;
      font-weight:800;
      outline:none;
      -webkit-appearance:none;
      appearance:none;
    }
    .input:focus,.select:focus{
      border-color:rgba(255,0,110,.38);
      box-shadow:0 0 0 1px rgba(255,0,110,.25);
    }
    .sheet .actions{
      display:flex; gap:10px;
      padding: 0;
      margin-top:12px;
    }
    .btn{
      flex:1;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:#fff;
      font-weight:950;
      cursor:pointer;
      transition:transform .15s ease;
    }
    .btn:active{transform:scale(.99)}
    .btn.primary{
      border:none;
      background:linear-gradient(45deg,var(--pink1),var(--pink2));
      box-shadow:0 10px 24px rgba(255,0,110,.18);
    }
    .btn.ghost{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.12);
      color:rgba(255,255,255,.86);
    }

    /* ===== Toast ===== */
    .toast{
      position:fixed; left:50%;
      bottom: calc(var(--tg-bottom-inset) + 16px);
      transform:translateX(-50%) translateY(18px);
      background:rgba(0,0,0,.88);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      padding:10px 14px;
      border-radius:14px;
      opacity:0; pointer-events:none;
      transition:opacity .22s ease, transform .22s ease;
      z-index:1000;
      max-width:92vw;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      font-weight:900;
    }
    .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

    /* ===== GPS floating button (FAB) ===== */
    .gps-fab{
      position:fixed;
      right: 16px;
      bottom: calc(var(--tg-bottom-inset) + 16px);
      width:56px; height:56px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:linear-gradient(45deg,var(--pink1),var(--pink2));
      box-shadow:0 18px 46px rgba(255,0,110,.28);
      color:#fff;
      display:none;
      align-items:center;
      justify-content:center;
      font-size:22px;
      font-weight:950;
      cursor:pointer;
      z-index:1200;
      user-select:none;
      transition:transform .15s ease, filter .15s ease;
    }
    .gps-fab:active{transform:scale(.98)}
    .gps-fab:hover{filter:brightness(1.05)}

    /* ===== GPS modal ===== */
    .gps-modal{
      position:fixed; inset:0;
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      display:none;
      z-index:1250;
      padding: 16px;
      padding-bottom: calc(var(--tg-bottom-inset) + 16px);
    }
    .gps-modal .card{
      position:absolute; left:50%; top:50%;
      transform:translate(-50%,-50%);
      width:min(520px, calc(100vw - 24px));
      background:rgba(17,17,17,.94);
      border:1px solid rgba(255,255,255,.10);
      border-radius:22px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .gps-modal .head{
      padding:14px 16px 12px;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .gps-modal .head .ttl{font-weight:950}
    .gps-modal .head .x{
      width:34px;height:34px;border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:#fff; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-weight:950;
    }
    .gps-modal .body{padding:16px}
    .gps-hero{
      display:flex; gap:14px; align-items:center;
      padding: 10px 0 6px;
    }
    .gps-avatar{
      width:58px; height:58px; border-radius:999px;
      background:linear-gradient(135deg, rgba(255,0,110,.95), rgba(255,77,148,.95));
      border:2px solid rgba(255,255,255,.14);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 14px 30px rgba(255,0,110,.22);
      flex-shrink:0;
      font-weight:950;
      letter-spacing:1px;
    }
    .gps-text{min-width:0}
    .gps-title{
      font-size:15px;
      font-weight:950;
      margin-bottom:4px;
      color:rgba(255,255,255,.92);
    }
    .gps-sub{
      font-size:13px;
      line-height:1.45;
      color:rgba(255,255,255,.62);
    }
    .gps-modal .actions{
      display:flex;
      gap:10px;
      margin-top:14px;
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- TOP -->
    <div class="top">
      <div class="top-inner">
        <div class="brand-wrap">
          <div class="logo">A</div>
          <div class="brand">
            <div class="title">AIKA</div>
            <div class="sub" id="subTitle">Люди рядом</div>
          </div>
        </div>
        <div class="actions">
          <button class="pill" id="myProfileBtnHead">👤 Мой профиль</button>
          <button class="pill primary" id="filterBtn">🔍 Фильтр</button>
        </div>
      </div>

      <div class="lang-row">
        <button class="lang-btn" id="ru-btn">RU</button>
        <button class="lang-btn active" id="kz-btn">KZ</button>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <div class="container">
        <div class="chips">
          <div class="chip"><span class="dot"></span><span id="chipMain">Лента рядом</span></div>
          <div class="chip muted" id="chipRadius">Радиус: <b id="chipRadiusVal">50</b> км</div>
        </div>

        <div id="loader" class="loader">
          <div class="spinner"></div>
          <div id="loaderText">Загружаем людей рядом...</div>
          <div class="skeleton">
            <div class="sk-card"></div>
            <div class="sk-card"></div>
            <div class="sk-card"></div>
          </div>
        </div>

        <div id="usersList"></div>

        <div id="emptyState" class="empty" style="display:none;">
          <div class="icon">💔</div>
          <div class="title" id="emptyText">Пока никого нет рядом</div>
          <div class="sub" id="tryLater">Попробуйте позже</div>
        </div>
      </div>
    </div>

    <!-- FILTER SHEET -->
    <div class="sheet" id="sheet">
      <div class="card">
        <div class="head">
          <div class="ttl" id="sheetTitle">Фильтр</div>
          <button class="x" id="sheetClose" type="button">✕</button>
        </div>
        <div class="body">
          <div class="row">
            <div>
              <label class="lbl" id="radiusLbl">Радиус, км (1–300)</label>
              <input class="input" type="number" min="1" max="300" id="radiusInput" value="50" inputmode="numeric" />
            </div>
            <div>
              <label class="lbl" id="sexLbl">Пол</label>
              <select class="select" id="sexInput">
                <option value="">Любой</option>
                <option value="male">Мужчина</option>
                <option value="female">Женщина</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div>
              <label class="lbl" id="ageFromLbl">Возраст от</label>
              <input class="input" type="number" min="18" max="100" id="ageFromInput" placeholder="18" inputmode="numeric" />
            </div>
            <div>
              <label class="lbl" id="ageToLbl">Возраст до</label>
              <input class="input" type="number" min="18" max="100" id="ageToInput" placeholder="100" inputmode="numeric" />
            </div>
          </div>

          <div class="row">
            <div>
              <label class="lbl" id="qLbl">Поиск (о себе/ник)</label>
              <input class="input" type="text" id="qInput" placeholder="спорт, музыка..." />
            </div>
          </div>

          <div class="actions">
            <button class="btn" id="resetBtn" type="button">Сброс</button>
            <button class="btn primary" id="applyBtn" type="button">Показать</button>
          </div>
        </div>
      </div>
    </div>

    <!-- GPS FAB -->
    <button class="gps-fab" id="gpsFab" type="button" aria-label="GPS">📍</button>

    <!-- GPS MODAL -->
    <div class="gps-modal" id="gpsModal">
      <div class="card">
        <div class="head">
          <div class="ttl" id="gpsModalTitle">Геолокация</div>
          <button class="x" id="gpsModalClose" type="button">✕</button>
        </div>
        <div class="body">
          <div class="gps-hero">
            <div class="gps-avatar">A</div>
            <div class="gps-text">
              <div class="gps-title" id="gpsAskTitle">Разрешите геолокацию</div>
              <div class="gps-sub" id="gpsAskSub">Чтобы показывать людей рядом, AIKA нужен доступ к геоданным.</div>
            </div>
          </div>
          <div class="actions">
            <button class="btn ghost" id="gpsSkipBtn" type="button">Не сейчас</button>
            <button class="btn primary" id="gpsAllowBtn" type="button">Разрешить</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">✅</div>
  </div>

  <script>
    /* =========================
       I18N
    ========================= */
    const t = {
      ru: {
        subTitle: 'Люди рядом',
        feed: 'Лента рядом',
        filter: '🔍 Фильтр',
        my: '👤 Мой профиль',
        loading: 'Загружаем людей рядом...',
        empty: 'Пока никого нет рядом',
        tryLater: 'Попробуйте позже',
        years: 'лет',
        male: '👨',
        female: '👩',
        sheetTitle: 'Фильтр',
        radius: 'Радиус, км (1–300)',
        sex: 'Пол',
        any: 'Любой',
        ageFrom: 'Возраст от',
        ageTo: 'Возраст до',
        q: 'Поиск (о себе/ник)',
        reset: 'Сброс',
        show: 'Показать',
        radiusChip: (n)=>`Радиус: ${n} км`,
        newUsers: (n)=>`✨ Новые рядом: ${n}`,

        gpsNeedToast: '📍 Включите геолокацию, чтобы видеть людей рядом',
        gpsGotToast: '✅ Геоданные получены',
        gpsDeniedToast: '📍 Геолокация отключена',
        gpsOpenSettings: '⚙️ Откройте настройки и разрешите геолокацию',
        gpsModalTitle: 'Геолокация',
        gpsAskTitle: 'Разрешите геолокацию',
        gpsAskSub: 'Чтобы показывать людей рядом, AIKA нужен доступ к геоданным.',
        gpsAllow: 'Разрешить',
        gpsSkip: 'Не сейчас',
      },
      kz: {
        subTitle: 'Жақын адамдар',
        feed: 'Жақын лента',
        filter: '🔍 Сүзгі',
        my: '👤 Менің профилім',
        loading: 'Жақын маңдағы адамдарды жүктеу...',
        empty: 'Жақын маңда әлі ешкім жоқ',
        tryLater: 'Кейінірек көріңіз',
        years: 'жас',
        male: '👨',
        female: '👩',
        sheetTitle: 'Сүзгі',
        radius: 'Радиус, км (1–300)',
        sex: 'Жынысы',
        any: 'Кез келген',
        ageFrom: 'Жасы (ең аз)',
        ageTo: 'Жасы (ең көп)',
        q: 'Іздеу (өзім/ник)',
        reset: 'Тазарту',
        show: 'Көрсету',
        radiusChip: (n)=>`Радиус: ${n} км`,
        newUsers: (n)=>`✨ Жаңа адамдар: ${n}`,

        gpsNeedToast: '📍 Жақын адамдарды көру үшін геолокацияны қосыңыз',
        gpsGotToast: '✅ Геолокация алынды',
        gpsDeniedToast: '📍 Геолокация өшірулі',
        gpsOpenSettings: '⚙️ Баптауларға кіріп, геолокацияға рұқсат беріңіз',
        gpsModalTitle: 'Геолокация',
        gpsAskTitle: 'Геолокацияға рұқсат беріңіз',
        gpsAskSub: 'Жақын адамдарды көрсету үшін AIKA-ға геодеректерге қол жеткізу керек.',
        gpsAllow: 'Рұқсат беру',
        gpsSkip: 'Қазір емес',
      }
    };

    /* =========================
       Telegram + helpers
    ========================= */
    const tg = window.Telegram?.WebApp || {};
    const $ = (id) => document.getElementById(id);

    function updateViewportVars(){
      try{
        const vh = tg?.viewportStableHeight || window.innerHeight;
        const safeTop = tg?.safeAreaInset?.top ?? 0;
        const safeBottom = tg?.safeAreaInset?.bottom ?? 0;
        const contentTop = tg?.contentSafeAreaInset?.top ?? 0;
        const contentBottom = tg?.contentSafeAreaInset?.bottom ?? 0;

        const root = document.documentElement.style;
        root.setProperty('--tg-viewport-stable-height', `${vh}px`);
        root.setProperty('--tg-safe-area-inset-top', `${safeTop}px`);
        root.setProperty('--tg-safe-area-inset-bottom', `${safeBottom}px`);
        root.setProperty('--tg-content-safe-area-inset-top', `${contentTop}px`);
        root.setProperty('--tg-content-safe-area-inset-bottom', `${contentBottom}px`);
      }catch(_){}
    }

    try{
      tg.ready?.();
      tg.expand?.();
      tg.onEvent?.('viewportChanged', updateViewportVars);
      try{ tg.setHeaderColor?.('#000000'); }catch(_){}
      try{ tg.disableVerticalSwipes?.(); }catch(_){}
    }catch(_){}
    updateViewportVars();
    addEventListener('resize', updateViewportVars);

    const currentTelegramId = tg.initDataUnsafe?.user?.id ?? null;

    /* =========================
       GEO: storage + policy
       status: 'granted' | 'denied' | 'skipped'
    ========================= */
    const GEO_KEY = 'aika_geo_permission_v3';
    const GEO_TTL = 30 * 24 * 60 * 60 * 1000;

    function geoGetStored(){
      try{
        const raw = localStorage.getItem(GEO_KEY);
        if(!raw) return null;
        const data = JSON.parse(raw);
        if(!data || !data.ts || !data.status) return null;
        if(Date.now() - data.ts > GEO_TTL){
          localStorage.removeItem(GEO_KEY);
          return null;
        }
        return data.status;
      }catch(_){ return null; }
    }
    function geoSetStored(status){
      try{ localStorage.setItem(GEO_KEY, JSON.stringify({status, ts: Date.now()})); }catch(_){}
    }

    /* =========================
       UI: language (DEFAULT KZ)
    ========================= */
    let lang = (localStorage.getItem('aika_lang') || 'kz');

    let currentLocation = null;
    let lastQuery = { radius_km: 50, sex: '', age_min: null, age_max: null, q: '' };

    function setLang(l){
      lang = l;
      localStorage.setItem('aika_lang', l);

      $('ru-btn').classList.toggle('active', l==='ru');
      $('kz-btn').classList.toggle('active', l==='kz');

      $('subTitle').textContent = t[l].subTitle;
      $('chipMain').textContent = t[l].feed;

      $('filterBtn').textContent = t[l].filter;
      $('myProfileBtnHead').textContent = t[l].my;
      $('loaderText').textContent = t[l].loading;

      $('emptyText').textContent = t[l].empty;
      $('tryLater').textContent = t[l].tryLater;

      $('sheetTitle').textContent = t[l].sheetTitle;
      $('radiusLbl').textContent = t[l].radius;
      $('sexLbl').textContent = t[l].sex;
      $('sexInput').options[0].text = t[l].any;
      $('sexInput').options[1].text = (l==='ru' ? 'Мужчина' : 'Ер адам');
      $('sexInput').options[2].text = (l==='ru' ? 'Женщина' : 'Әйел адам');
      $('ageFromLbl').textContent = t[l].ageFrom;
      $('ageToLbl').textContent = t[l].ageTo;
      $('qLbl').textContent = t[l].q;
      $('resetBtn').textContent = t[l].reset;
      $('applyBtn').textContent = t[l].show;

      $('gpsModalTitle').textContent = t[l].gpsModalTitle;
      $('gpsAskTitle').textContent = t[l].gpsAskTitle;
      $('gpsAskSub').textContent = t[l].gpsAskSub;
      $('gpsAllowBtn').textContent = t[l].gpsAllow;
      $('gpsSkipBtn').textContent = t[l].gpsSkip;

      $('chipRadius').innerHTML = t[l].radiusChip(lastQuery.radius_km).replace(
        String(lastQuery.radius_km),
        `<b id="chipRadiusVal">${lastQuery.radius_km}</b>`
      );
    }

    $('ru-btn').onclick = ()=>setLang('ru');
    $('kz-btn').onclick = ()=>setLang('kz');

    /* =========================
       Buttons
    ========================= */
    $('myProfileBtnHead').onclick = ()=>{ location.href='/user-update.html'; };

    $('filterBtn').onclick = ()=>{ $('sheet').style.display='block'; };
    $('sheetClose').onclick = ()=>{ $('sheet').style.display='none'; };
    $('sheet').onclick = (e)=>{ if(e.target.id==='sheet') $('sheet').style.display='none'; };

    $('resetBtn').onclick = ()=>{
      $('radiusInput').value = 50;
      $('sexInput').value = '';
      $('ageFromInput').value = '';
      $('ageToInput').value = '';
      $('qInput').value = '';
    };

    /* =========================
       Toast
    ========================= */
    function showToast(msg){
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      try{ tg.HapticFeedback?.notificationOccurred('success'); }catch(_){}
      clearTimeout(showToast._tmr);
      showToast._tmr = setTimeout(()=>el.classList.remove('show'), 1600);
    }

    /* =========================
       Rendering
    ========================= */
    function sexEmoji(sex){ return sex==='male' ? t[lang].male : t[lang].female; }

    function renderUser(u){
      const dist = (typeof u.distance_km === 'number' && u.distance_km > 0) ? u.distance_km : null;
      const distanceText = dist != null
        ? `<span class="distance">📍 ${dist < 1 ? Math.round(dist*1000)+' м' : dist.toFixed(1)+' км'}</span>`
        : '';
      const avatarURL = u.avatar_url ? u.avatar_url : (u.avatar_path ? `/${u.avatar_path}` : '');
      const avatar = avatarURL
        ? `<img src="${avatarURL}" alt="${(u.nickname||'').replace(/"/g,'&quot;')}" loading="lazy">`
        : `<div class="ph">${sexEmoji(u.sex)}</div>`;
      const ageText = (u.age != null && u.age !== '') ? `${u.age} ${t[lang].years}` : '';
      const about = u.about_user ? String(u.about_user) : '';

      return `
        <div class="user-card" data-id="${u.id}" onclick="openProfile('${u.id}')">
          <div class="avatar">${avatar}</div>
          <div class="info">
            <div class="name-row">
              <div class="nickname">${u.nickname || '—'}</div>
              ${distanceText}
            </div>
            <div class="meta">
              <span>${sexEmoji(u.sex)}</span>
              ${ageText ? `<span class="badge">${ageText}</span>` : ''}
            </div>
            <div class="about">${about}</div>
          </div>
        </div>
      `;
    }

    function buildNearbyUrl(){
      let url = '/api/users/nearby?limit=50';
      if(currentLocation){
        url += `&location=${currentLocation.latitude},${currentLocation.longitude}&radius_km=${encodeURIComponent(lastQuery.radius_km)}`;
      }
      if(lastQuery.sex) url += `&sex=${encodeURIComponent(lastQuery.sex)}`;
      if(lastQuery.age_min != null) url += `&age_min=${lastQuery.age_min}`;
      if(lastQuery.age_max != null) url += `&age_max=${lastQuery.age_max}`;
      if(lastQuery.q) url += `&q=${encodeURIComponent(lastQuery.q)}`;
      return url;
    }

    function filterOutSelf(arr){
      const myId = currentTelegramId == null ? null : Number(currentTelegramId);
      return Array.isArray(arr)
        ? arr.filter(u => (typeof u.user_id === 'number' ? u.user_id : Number(u.user_id)) !== myId)
        : [];
    }

    function showEmpty(){
      $('loader').style.display='none';
      $('emptyState').style.display='block';
    }

    let shownIds = new Set();
    let polling = false;

    async function fetchUsers({fullRerender=false}={}){
      if(!fullRerender){
        $('usersList').innerHTML='';
        $('emptyState').style.display='none';
        $('loader').style.display='block';
      }
      try{
        const resp = await fetch(buildNearbyUrl(), { cache:'no-store' });
        const users = filterOutSelf(await resp.json());

        $('loader').style.display='none';
        if(!users.length){
          showEmpty();
          shownIds.clear();
          sessionStorage.setItem('aika_last_feed', JSON.stringify([]));
          return;
        }

        $('usersList').innerHTML = users.map(renderUser).join('');
        shownIds = new Set(users.map(u => String(u.id)));

        sessionStorage.setItem('aika_last_feed', JSON.stringify(users));
      }catch(e){
        console.error(e);
        showEmpty();
      }
    }

    async function silentUpdate(){
      try{
        const resp = await fetch(buildNearbyUrl(), { cache:'no-store' });
        const latest = filterOutSelf(await resp.json());
        if(!Array.isArray(latest) || !latest.length) return;

        const newOnes = latest.filter(u => !shownIds.has(String(u.id)));
        if(newOnes.length){
          for(let i=newOnes.length-1;i>=0;i--){
            $('usersList').insertAdjacentHTML('afterbegin', renderUser(newOnes[i]));
            shownIds.add(String(newOnes[i].id));
          }
          showToast(t[lang].newUsers(newOnes.length));

          const cards = document.querySelectorAll('.user-card');
          for(let i=100;i<cards.length;i++) cards[i].remove();

          const existing = JSON.parse(sessionStorage.getItem('aika_last_feed') || '[]');
          const merged = [...newOnes, ...existing.filter(u => !newOnes.find(n => String(n.id)===String(u.id)))];
          sessionStorage.setItem('aika_last_feed', JSON.stringify(merged));
        }
      }catch(_){}
    }

    function startPolling(){
      setInterval(async ()=>{
        if(polling) return;
        polling = true;
        try{ await silentUpdate(); } finally { polling = false; }
      }, 5000);
    }

    window.openProfile = function(id){
      const qs = currentLocation
        ? `?id=${encodeURIComponent(id)}&origin=${currentLocation.latitude},${currentLocation.longitude}`
        : `?id=${encodeURIComponent(id)}`;
      location.href = `/user-detail.html${qs}`;
    };

    /* =========================
       GEO: Telegram LocationManager (preferred)
       + Browser fallback (only if no TG LM)
       IMPORTANT: iOS won't show prompt again after deny -> use openSettings()
    ========================= */
    function getTgLocationManager(){
      const lm = tg?.LocationManager;
      return (lm && typeof lm.init === 'function' && typeof lm.getLocation === 'function') ? lm : null;
    }

    async function tgGetLocation(timeoutMs=10000){
      const lm = getTgLocationManager();
      if(!lm) return null;

      let settled = false;
      return await new Promise((resolve)=>{
        const done = (val)=>{ if(settled) return; settled = true; resolve(val); };
        const timer = setTimeout(()=>done(null), timeoutMs);

        const get = ()=>{
          try{
            lm.getLocation((loc)=>{
              clearTimeout(timer);
              const lat = loc?.latitude;
              const lng = loc?.longitude;
              if(typeof lat !== 'number' || typeof lng !== 'number') return done(null);
              done({ latitude: lat, longitude: lng, source: 'tg' });
            });
          }catch(_){
            clearTimeout(timer);
            done(null);
          }
        };

        try{
          if(!lm.isInited){
            lm.init(()=>get());
          }else{
            get();
          }
        }catch(_){
          clearTimeout(timer);
          done(null);
        }
      });
    }

    async function tgOpenSettings(){
      try{
        const lm = getTgLocationManager();
        if(lm && typeof lm.openSettings === 'function'){
          lm.openSettings();
          return true;
        }
      }catch(_){}
      return false;
    }

    async function brGetLocation(timeoutMs=12000){
      if(!navigator.geolocation) return null;

      let settled = false;
      return await new Promise((resolve)=>{
        const done = (val)=>{ if(settled) return; settled = true; resolve(val); };
        const timer = setTimeout(()=>done(null), timeoutMs);

        try{
          navigator.geolocation.getCurrentPosition(
            (pos)=>{
              clearTimeout(timer);
              const lat = pos?.coords?.latitude;
              const lng = pos?.coords?.longitude;
              if(typeof lat !== 'number' || typeof lng !== 'number') return done(null);
              done({ latitude: lat, longitude: lng, source: 'browser' });
            },
            ()=>{
              clearTimeout(timer);
              done(null);
            },
            { enableHighAccuracy:true, timeout: Math.min(10000, timeoutMs), maximumAge:0 }
          );
        }catch(_){
          clearTimeout(timer);
          done(null);
        }
      });
    }

    // Unified: try TG LM; if absent -> browser
    async function requestLocationByUserGesture(){
      const lm = getTgLocationManager();
      if(lm){
        const loc = await tgGetLocation(10000);
        return loc; // null if denied/unavailable
      }
      return await brGetLocation(12000);
    }

    /* =========================
       GPS UI (FAB + modal)
    ========================= */
    function showGpsFab(show){
      $('gpsFab').style.display = show ? 'flex' : 'none';
    }

    function openGpsModal(){
      $('gpsModal').style.display = 'block';
    }
    function closeGpsModal(){
      $('gpsModal').style.display = 'none';
    }

    $('gpsFab').onclick = ()=>{
      openGpsModal();
      showToast(t[lang].gpsNeedToast);
    };
    $('gpsModalClose').onclick = closeGpsModal;
    $('gpsModal').onclick = (e)=>{ if(e.target.id === 'gpsModal') closeGpsModal(); };

    $('gpsSkipBtn').onclick = ()=>{
      geoSetStored('skipped');
      closeGpsModal();
      showGpsFab(true);
      showToast(t[lang].gpsDeniedToast);
    };

    // If we open settings, we want to retry once user returns
    let retryAfterSettings = false;

    async function applyLocation(loc){
      currentLocation = { latitude: loc.latitude, longitude: loc.longitude };
      geoSetStored('granted');
      closeGpsModal();
      showGpsFab(false);
      showToast(t[lang].gpsGotToast);
      await fetchUsers({fullRerender:true});
    }

    async function handleAllowClick(){
      $('gpsAllowBtn').disabled = true;
      $('gpsSkipBtn').disabled = true;
      try{
        const loc = await requestLocationByUserGesture();
        if(loc){
          await applyLocation(loc);
          return;
        }

        // No location:
        // - if TG LM exists and user previously denied, iOS won't show prompt again.
        //   Open settings so user can enable.
        const lm = getTgLocationManager();
        if(lm){
          geoSetStored('denied');
          retryAfterSettings = true;
          const opened = await tgOpenSettings();
          closeGpsModal();
          showGpsFab(true);
          showToast(opened ? t[lang].gpsOpenSettings : t[lang].gpsDeniedToast);
          return;
        }

        // Browser fallback case
        geoSetStored('denied');
        closeGpsModal();
        showGpsFab(true);
        showToast(t[lang].gpsDeniedToast);
      } finally {
        $('gpsAllowBtn').disabled = false;
        $('gpsSkipBtn').disabled = false;
      }
    }

    $('gpsAllowBtn').onclick = handleAllowClick;

    // When user returns from settings, retry once automatically
    document.addEventListener('visibilitychange', async ()=>{
      if(document.visibilityState !== 'visible') return;
      if(!retryAfterSettings) return;

      retryAfterSettings = false;

      const loc = await requestLocationByUserGesture();
      if(loc){
        await applyLocation(loc);
      }else{
        // Still denied
        geoSetStored('denied');
        currentLocation = null;
        showGpsFab(true);
      }
    });

    /* =========================
       Filter apply
    ========================= */
    $('applyBtn').onclick = async ()=>{
      $('sheet').style.display='none';

      lastQuery.radius_km = Math.min(300, Math.max(1, Number($('radiusInput').value || 50)));
      lastQuery.sex = $('sexInput').value;
      lastQuery.age_min = $('ageFromInput').value ? Number($('ageFromInput').value) : null;
      lastQuery.age_max = $('ageToInput').value ? Number($('ageToInput').value) : null;
      lastQuery.q = $('qInput').value.trim();

      $('chipRadius').innerHTML = t[lang].radiusChip(lastQuery.radius_km).replace(
        String(lastQuery.radius_km),
        `<b id="chipRadiusVal">${lastQuery.radius_km}</b>`
      );

      await fetchUsers({fullRerender:true});
    };

    /* =========================
       BOOT
       IMPORTANT CHANGE:
       - No auto-permission prompt on load.
       - If granted earlier -> we try to read location silently (won't show prompt)
       - If not granted -> show FAB and modal (user gesture)
    ========================= */
    async function boot(){
      setLang(lang);

      $('chipRadius').innerHTML = t[lang].radiusChip(lastQuery.radius_km).replace(
        String(lastQuery.radius_km),
        `<b id="chipRadiusVal">${lastQuery.radius_km}</b>`
      );

      const stored = geoGetStored();

      // If already granted -> try to get location (should succeed without extra prompt)
      if(stored === 'granted'){
        const loc = await requestLocationByUserGesture();
        if(loc){
          currentLocation = { latitude: loc.latitude, longitude: loc.longitude };
          showGpsFab(false);
        }else{
          // permission might be revoked
          geoSetStored('denied');
          currentLocation = null;
          showGpsFab(true);
          showToast(t[lang].gpsNeedToast);
        }
      } else {
        // First time / denied / skipped -> do not auto prompt
        currentLocation = null;
        showGpsFab(true);

        // If first time (null) - open modal once to ask politely
        if(stored == null){
          openGpsModal();
        }
      }

      await fetchUsers({fullRerender:true});
      startPolling();
    }

    boot();
  </script>
</body>
